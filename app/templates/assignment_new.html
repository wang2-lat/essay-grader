{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-semibold mb-6">新建作业</h1>
  <form method="post" action="/assignments" class="bg-white rounded-xl border border-slate-200 p-6 space-y-4">
    <div>
      <label class="text-sm text-slate-600 block mb-1">标题</label>
      <input name="title" required class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="如：议论文 — 科技对社交的影响">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm text-slate-600 block mb-1">文体</label>
        <select name="essay_type" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white">
          <option value="argumentative essay">议论文 Argumentative</option>
          <option value="expository essay">说明文 Expository</option>
          <option value="narrative essay">记叙文 Narrative</option>
          <option value="source-based essay">材料作文 Source-based</option>
        </select>
      </div>
      <div>
        <label class="text-sm text-slate-600 block mb-1">年级（可选）</label>
        <input name="grade_level" class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="如：Grade 10">
      </div>
    </div>
    <div>
      <label class="text-sm text-slate-600 block mb-1">题目 / 写作要求</label>
      <textarea name="prompt" rows="6" class="w-full border border-slate-300 rounded-lg px-3 py-2" placeholder="把题目和要求贴在这里，评分时会作为依据。"></textarea>
    </div>
    <div class="flex gap-3">
      <button class="bg-indigo-600 text-white rounded-lg px-4 py-2 font-medium hover:bg-indigo-700">创建</button>
      <a href="/dashboard" class="px-4 py-2 text-slate-500 hover:text-slate-700">取消</a>
    </div>
  </form>
</div>
{% endblock %}
