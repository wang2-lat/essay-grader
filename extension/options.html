<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Essay Grader · Settings</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; max-width: 460px; margin: 40px auto; color: #1e293b; padding: 0 16px; }
    h1 { font-size: 18px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; font-size: 13px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { margin-top: 18px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 600; cursor: pointer; }
    .ok { color: #15803d; margin-left: 10px; font-size: 13px; }
    .hint { color: #64748b; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Essay Grader · Settings</h1>
  <label>API address</label>
  <input id="apiBase" placeholder="http://127.0.0.1:8011">
  <p class="hint">Where the backend runs (uvicorn app.main:app --port 8011).</p>
  <label>API token</label>
  <input id="apiToken" placeholder="leave empty unless your backend sets one">
  <p class="hint">Matches GRADER_API_TOKEN in the backend's .env. Leave empty if the backend has no token.</p>
  <button id="save">Save</button><span id="ok" class="ok"></span>
  <script src="options.js"></script>
</body>
</html>
